<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KA Survival - 3D Co-op RPG Survival Game</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Modular CSS Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="stylesheet" href="css/touch.css">

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Firebase App & Database (Compat V10) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
        // TRÌNH BẮT LỖI HIỂN THỊ LÊN MÀN HÌNH (DÙNG ĐỂ TÌM LỖI FIREBASE)
        window.onerror = function(msg, url, line) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:10px;left:10%;width:80%;background:red;color:white;z-index:99999;padding:15px;font-weight:bold;border-radius:8px;';
            errDiv.innerHTML = "LỖI HỆ THỐNG: " + msg;
            document.body.appendChild(errDiv);
        };
        const origConsoleError = console.error;
        console.error = function() {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:80px;left:10%;width:80%;background:darkred;color:yellow;z-index:99999;padding:15px;font-weight:bold;border-radius:8px;';
            errDiv.innerHTML = "LỖI FIREBASE (ERROR): " + Array.from(arguments).join(" ");
            document.body.appendChild(errDiv);
            origConsoleError.apply(console, arguments);
        };
        const origConsoleWarn = console.warn;
        console.warn = function() {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:150px;left:10%;width:80%;background:orange;color:black;z-index:99999;padding:15px;font-weight:bold;border-radius:8px;';
            errDiv.innerHTML = "CẢNH BÁO FIREBASE (WARN): " + Array.from(arguments).join(" ");
            document.body.appendChild(errDiv);
            origConsoleWarn.apply(console, arguments);
        };
    </script>
    <!-- FIREBASE INITIALIZATION -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBbX9rnJmS1T2RiRuj3Ry5IzZxwFh9Y9SA",
            authDomain: "kafev-bef0a.firebaseapp.com",
            projectId: "kafev-bef0a",
            storageBucket: "kafev-bef0a.firebasestorage.app",
            messagingSenderId: "731056008261",
            appId: "1:731056008261:web:46d8d9a7bc0a97f912c72c",
            measurementId: "G-YEKS1NR0XN"
        };
        // Cấu hình URL chuẩn xác mà bạn vừa tạo
        firebaseConfig.databaseURL = "https://kafev-bef0a-default-rtdb.asia-southeast1.firebasedatabase.app";
        firebase.initializeApp(firebaseConfig);

        // ==========================================
        // BÀI TEST GỬI TÍN HIỆU ĐẾN SERVER FIREBASE
        // ==========================================
        const testDb = firebase.database();
        testDb.ref('server_test_ping').set({
            time: new Date().toLocaleTimeString(),
            status: "Thành công 100%!"
        }).then(() => {
            testDb.ref('server_test_ping').once('value').then(snap => {
                const testMsg = document.createElement('div');
                testMsg.style.cssText = 'position:fixed;top:10px;left:10%;width:80%;background:green;color:white;z-index:99999;padding:15px;font-weight:bold;border-radius:8px;text-align:center;box-shadow:0 4px 15px rgba(0,255,0,0.3);';
                testMsg.innerHTML = "🎉 CHÚC MỪNG! TÍN HIỆU GỬI/NHẬN FIREBASE ĐÃ THÔNG SUỐT 100%!";
                document.body.appendChild(testMsg);
                setTimeout(() => testMsg.remove(), 5000); // Ẩn sau 5 giây
            });
        }).catch(err => {
            console.error("LỖI KẾT NỐI SERVER: " + err.message);
        });
        // ==========================================
    </script>
</head>
<body>
    <div id="game-container">
        <canvas id="three-canvas"></canvas>

        <!-- STEP 1: LOGIN MODAL OVERLAY -->
        <div id="login-modal" class="login-overlay">
            <div class="login-card glass-panel">
                <div class="game-badge" style="margin: 0 auto 12px auto;">
                    <span class="pulse-dot"></span>
                    <span class="badge-text">KA SURVIVAL v2.0</span>
                </div>
                <h1 class="login-title">PLAYER LOGIN</h1>
                <p class="login-subtitle">Enter your character name to continue</p>

                <div class="input-group">
                    <input type="text" id="player-name-input" class="login-input" placeholder="Enter Character Name..." maxlength="15" autocomplete="off">
                </div>

                <button id="btn-login-start" class="login-btn">
                    <span>ENTER WORLD 🌍</span>
                </button>
            </div>
        </div>

        <!-- In-Game UI Overlay -->
        <div id="ui-overlay" style="display: none;">
            
            <!-- Settings Gear Button -->
            <button id="btn-settings" class="settings-btn" onclick="document.getElementById('settings-modal').style.display='flex';">
                ⚙️
            </button>

            <!-- Touch Controls for Mobile (Hidden by Default) -->
            <div id="mobile-controls-wrapper" style="display: none;">
                <div id="joystick-zone">
                    <div id="joystick-base">
                        <div id="joystick-stick"></div>
                    </div>
                </div>

                <div id="touch-action-zone">
                    <button id="btn-touch-run" class="touch-btn">
                        <span class="btn-icon">🏃</span>
                        <span class="btn-label">RUN</span>
                    </button>
                </div>

                <div id="camera-touch-hint" class="mobile-hint">
                    <span>👉 Swipe right screen to rotate</span>
                </div>
            </div>

            <!-- Legacy UI Elements (Hidden to keep JS happy) -->
            <div id="hidden-legacy-ui" style="display: none;">
                <span id="player-display-name"></span>
                <span id="player-state"></span>
                <span id="room-code-display"></span>
                <span id="friend-status-text"></span>
                <div id="friend-status-badge"></div>
                <div id="hotbar-container"></div>
                <button id="btn-copy-invite"></button>
            </div>
        </div>

        <!-- SETTINGS MODAL -->
        <div id="settings-modal" class="login-overlay" style="display: none; z-index: 10000;">
            <div class="login-card glass-panel" style="max-width: 320px; padding: 25px;">
                <h1 class="login-title" style="margin-bottom: 25px;">CÀI ĐẶT</h1>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                    <span style="color: white; font-weight: 500;">Bật Controller (Điện thoại)</span>
                    <label style="position: relative; display: inline-block; width: 50px; height: 28px;">
                        <input type="checkbox" id="toggle-mobile-controls" style="opacity: 0; width: 0; height: 0;" onchange="document.getElementById('mobile-controls-wrapper').style.display = this.checked ? 'block' : 'none';">
                        <span style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px;">
                            <span style="position: absolute; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;" id="toggle-slider"></span>
                        </span>
                    </label>
                </div>

                <!-- NÚT PHÓNG TO TOÀN MÀN HÌNH -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px;">
                    <span style="color: white; font-weight: 500;">Phóng to toàn màn hình</span>
                    <button class="login-btn secondary" onclick="toggleFullScreen();" style="width: auto; padding: 5px 15px; margin: 0; min-width: 60px;">
                        <span>MỞ</span>
                    </button>
                </div>

                <button class="login-btn secondary" onclick="document.getElementById('settings-modal').style.display='none';" style="margin-top: 0;">
                    <span>ĐÓNG</span>
                </button>
            </div>
        </div>
        
        <script>
            // Hàm Bật/Tắt Toàn Màn Hình
            function toggleFullScreen() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    const docElm = document.documentElement;
                    if (docElm.requestFullscreen) docElm.requestFullscreen();
                    else if (docElm.webkitRequestFullscreen) docElm.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }

            // CSS trực tiếp cho Toggle Switch để đỡ phải sửa file CSS
            const style = document.createElement('style');
            style.innerHTML = `
                .settings-btn {
                    position: absolute;
                    top: 20px;
                    right: 20px;
                    background: rgba(15, 23, 42, 0.7);
                    border: 1px solid rgba(56, 189, 248, 0.3);
                    border-radius: 50%;
                    width: 50px;
                    height: 50px;
                    font-size: 24px;
                    color: white;
                    cursor: pointer;
                    backdrop-filter: blur(8px);
                    transition: transform 0.2s, background 0.2s;
                    z-index: 100;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    pointer-events: auto !important;
                }
                .settings-btn:hover {
                    transform: scale(1.1) rotate(45deg);
                    background: rgba(15, 23, 42, 0.9);
                }
                input:checked + span { background-color: #38bdf8; }
                input:checked + span span { transform: translateX(22px); }
            `;
            document.head.appendChild(style);
        </script>
    </div>

    <!-- Application Script Entry Point -->
    <script src="js/app.js"></script>
</body>
</html>
